<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SoiSoi Website</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f0f0f;
    color:white;
    font-family:Arial;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{

    text-align:center;
    background:#1b1b1b;

    padding:50px;

    border-radius:20px;

    box-shadow:0 0 30px rgba(0,255,255,0.3);

}

h1{
    font-size:50px;
    margin-bottom:20px;
    color:cyan;
}

p{
    font-size:20px;
    margin-bottom:30px;
}

button{

    padding:15px 30px;

    border:none;

    border-radius:10px;

    background:cyan;

    color:black;

    font-size:18px;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    background:white;

    transform:scale(1.1);
}

</style>

</head>

<body>

<div class="container">

<h1>Welcome</h1>

<p>My Professional Website</p>

<button onclick="hello()">
Click Me
</button>

</div>

<script>

function hello(){

    alert("Welcome To SoiSoi Website!စော်မရှိကောင်");

}

</script>

</body>
</html>
